<!doctype html>
<html class="no-js" lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <meta http-equiv="x-ua-compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FVP Prijava</title>
  <link rel="stylesheet" href="css/foundation.css">
  <link rel="stylesheet" href="css/app.css">
</head>

<body>
  
  
  <div class="grid-x">
      <!-- Start Menu -->
      <ul class="vertical medium-horizontal menu cell" style="background-color: #ff6b00; font-size: 1.4rem;">
        <li><a href="index.html">Početna</a></li>
        <li><a href="program.html"> Kurikulum</a></li>
        <li><a href="prijava.html">Prijava</a></li>
  
      </ul>
  
  
  
      <!-- Hero section -->
      <div class="callout large forms">
        <!-- Anchors (links) -->
        <!-- <a href="about.html" class="button">Learn More</a>
          <a href="#features" class="button">View All Features</a> -->
  
        <!-- Buttons (actions) -->
        <button style="border-radius:2rem; color: #22571e; font-weight: 800; font-size: 1.2rem;" class="submit success button">Saznaj više</button>
  
      </div>
      
      <main class="cell">
        
        <!-- Form starts -->
        <h1>Prijavite se u Akademiju</h1>
        
        <form>
          <div class="grid-container">
            <div class="grid-x grid-padding-x">
              <div class="medium-6  cell">
                <label>Ime
                  <input style="border:1px solid var(--fpv-orange); border-radius:1rem;border-radius:1rem;"type="text" placeholder="Vaše ime">
                </label>
              </div>
              <div class="medium-6 cell">
                <label>Prezime
                  <input  style="border:1px solid var(--fpv-orange); border-radius:1rem;" type="text" placeholder="Vaše prezime">
                </label>
              </div>
            </div>
          </div>
          <div class="grid-x grid-padding-x">
          <div class="medium-6 cell">
          <label>
           Koliko godina imate?
            <input   style="border:1px solid var(--fpv-orange);border-radius:1rem; " type="number" value="30">
          </label>
          
          <div class="grid-x grid-padding-x">
          
          <div class="medium-6  cell">
            
            <label>
            Recite nam nešto o sebi?
              <textarea placeholder="None"></textarea>
            </label>
            
          </div>
          
          </div>
          <div class="grid-x grid-padding-x">
              <div class="medium-6 large-3 cell">
           <button  style="border-radius: 1rem; " class="submit success button">Pošalji prijavu</button>
           </div>
           </div>

          </div>
          
          </div>
        </form>
        
        
        <!-- form ends -->
        
        
        
        
      </main>
  
</body>
