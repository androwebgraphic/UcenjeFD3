<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpine.js Brojač</title>
    <link rel="stylesheet" href="css/style.css">
    <script defer src="alpine/alpine.3.17.2.js"></script>


</head>
<body>

  <!-- x-data je na glavnom kontejneru pa ga obje kartice dijele -->
  <div class="app-container" x-data="{ count: 0, title: 'I ❤️ Alpine', message: 'Hello world' }">
    <h1 x-text="title"></h1>
    <p x-text="message"></p>
    
    <h2>Brojač</h2>

    <!-- Prva kartica (Samo gumbi) -->
    <div class="counter-card">
      <div class="btn-group">
        <button class="btn-increment" x-on:click="(count++)">Increment (+)</button>
        <button class="btn-decrement" x-on:click="count--">Decrement (-)</button>
      </div>
    </div>

    <!-- Druga kartica (Jedini prikaz rezultata) -->
    <div class="counter-card">
      <label>Rezultat:</label>
      <span x-text="count"></span>
    </div>
  </div>

</body>
</html>
